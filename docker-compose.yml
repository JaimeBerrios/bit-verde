services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-bitverde}:${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-bitverde}?charset=utf8mb4
      PUBLIC_URL: https://bitverde.jaimeberrios.com
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Configura STAFF_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [backend, proxy]
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bitverde}
      MYSQL_USER: ${MYSQL_USER:-bitverde}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Configura ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [proxy]
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  proxy:
